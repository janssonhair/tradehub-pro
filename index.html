<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeHub Pro Ultimate V2 · 外贸工作台</title><style>
:root{font-family:Inter,'Microsoft YaHei',sans-serif;color:#e7edf9;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#111a30;border-right:1px solid #27314b;padding:25px 15px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:800;padding:10px 12px 32px;color:#fff}.brand span{color:#6a9bff}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#aebbd4;padding:13px;border-radius:11px;margin:4px 0}.nav.active,.nav:hover{background:#26375d;color:#fff}.main{flex:1;min-width:0;padding:32px 5%;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.eyebrow{color:#85a9ff;font-size:13px;font-weight:700;letter-spacing:2px}h1{font-size:36px;margin:12px 0}p{color:#aab8d1}.hero{background:linear-gradient(110deg,#233b78,#182447 65%,#182038);padding:32px;border:1px solid #39518a;border-radius:23px;margin:25px 0}.hero h2{margin:0;font-size:25px}.search{width:100%;padding:16px 20px;border-radius:13px;border:1px solid #3b527e;background:#0f1a34;color:#fff;margin-top:22px;outline:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #3d527b;background:#263b65;color:#fff;border-radius:10px;padding:11px 15px}.btn.primary{background:#4678ee;border-color:#4678ee}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}.chip{background:#1b2842;color:#bdcce6;border:1px solid #31405d;border-radius:20px;padding:9px 15px}.chip.active{background:#4678ee;color:white}.heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 15px}.heading h2{font-size:20px;margin:0}.count{color:#8e9db8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{background:#151f35;border:1px solid #2b3853;border-radius:16px;padding:18px;min-height:146px;display:flex;flex-direction:column;justify-content:space-between}.card:hover{border-color:#658cf0;transform:translateY(-2px)}.card-top{display:flex;justify-content:space-between;gap:10px}.logo{width:38px;height:38px;border-radius:11px;background:#2b3e65;display:grid;place-items:center;font-size:19px}.star{border:0;background:none;color:#7584a2;font-size:24px}.star.on{color:#f9c65f}.card a{color:#fff;text-decoration:none;font-weight:700;font-size:16px}.desc{font-size:12px;color:#91a3c1;margin-top:5px;overflow-wrap:anywhere}.card-foot{display:flex;justify-content:space-between;align-items:center}.tag{color:#82a6fa;font-size:12px}.mini{background:none;border:0;color:#9caed1}.modal{position:fixed;inset:0;background:#050a15bc;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.panel{background:#17233d;border:1px solid #3a4c70;border-radius:20px;padding:25px;width:min(460px,100%)}.panel input,.panel select{display:block;width:100%;margin:10px 0;padding:13px;background:#0d1730;border:1px solid #35486c;border-radius:10px;color:#fff}.panel label{font-size:13px;color:#aab8d1}.light{background:#f4f7fd;color:#1a2740}.light .side,.light .card,.light .panel{background:#fff;border-color:#dce4f0}.light .brand,.light .card a{color:#172440}.light .nav{color:#4e607a}.light .nav.active{background:#e7efff;color:#315ad2}.light .hero{background:linear-gradient(120deg,#dbe7ff,#f3f7ff);border-color:#ccdafa}.light .hero p,.light p{color:#60708a}.light .chip{background:#fff;color:#394d6d;border-color:#dce4f0}.light .chip.active{background:#4678ee;color:white}.light .search,.light .panel input,.light .panel select{background:#fff;color:#172440;border-color:#cad5e7}.light .btn{background:#e8efff;color:#284a8c}.light .btn.primary{background:#4678ee;color:white}@media(max-width:760px){.side{width:66px;padding:15px 5px}.brand{font-size:0;padding:15px 4px}.brand:before{content:'T';font-size:25px}.nav{font-size:0;text-align:center;padding:14px 4px}.nav:before{content:attr(data-icon);font-size:21px}.main{padding:20px}.top{align-items:flex-start}.top .actions{justify-content:flex-end}h1{font-size:26px}.hero{padding:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
/* Ultimate V2 enhancements */
:root{--accent:#6d93ff}body{background:#090e1b}.side{width:250px;background:#10182a}.main{max-width:1700px;padding:34px 4.5%}.brand{letter-spacing:-.6px}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 15%,#345baf88,transparent 36%),linear-gradient(115deg,#213e80,#14223e 75%);padding:38px}.hero:after{content:'✦';position:absolute;right:5%;top:0;font-size:135px;color:#ffffff0a;pointer-events:none}.card{transition:transform .18s,border-color .18s,box-shadow .18s;min-height:155px}.card:hover{box-shadow:0 12px 32px #0003}.logo img{width:25px;height:25px;object-fit:contain}.logo{overflow:hidden}.v2bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:15px 0}.searchrow{display:flex;align-items:center;gap:10px}.searchrow .search{margin-top:0;flex:1}.searchrow select,.v2bar select{border:1px solid #40557d;border-radius:10px;background:#172644;color:#eaf1ff;padding:11px}.quick{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.quick a{color:#d9e7ff;text-decoration:none;background:#ffffff15;border:1px solid #ffffff26;padding:8px 12px;border-radius:10px;font-size:13px}.quick a:hover{background:#ffffff30}.statline{display:flex;gap:16px;flex-wrap:wrap;margin:15px 0 0;color:#bbceec;font-size:13px}.statline strong{color:white}.footer{padding:36px 0;color:#8293b0;font-size:12px}.light .v2bar select,.light .searchrow select{background:white;color:#243653;border-color:#ccd6e5}.light .quick a{background:#ffffff88;color:#24416d;border-color:#bfd0ed}.light .statline,.light .statline strong{color:#375177}.light .footer{color:#697b95}.light .hero:after{color:#4771b10c}.empty{padding:40px;border:1px dashed #435576;border-radius:16px;color:#9eb0cb;text-align:center}.toast{position:fixed;bottom:24px;right:24px;background:#264d92;color:white;border-radius:12px;padding:13px 20px;box-shadow:0 12px 30px #0004;z-index:10}.nav{transition:background .2s}.top h1{letter-spacing:-1px}@media(max-width:760px){.side{width:60px}.main{padding:18px}.hero{padding:23px}.searchrow{flex-direction:column;align-items:stretch}.searchrow select{width:100%}.top{flex-wrap:wrap}.top .actions{width:100%;justify-content:flex-start}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.card{padding:13px}.card-foot{flex-wrap:wrap;gap:8px}.hero:after{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Trade<span>Hub</span> Pro</div><div id="nav"></div></aside><main class="main"><div class="top"><div><div class="eyebrow">TRADEHUB PRO · ULTIMATE V2</div><h1>外贸导航中心</h1><p>你的全球贸易数字工作台 · 免费、轻量、可自定义</p></div><div class="actions"><button class="btn" id="theme">☀ / ☾</button><button class="btn primary" id="add">＋ 添加网址</button></div></div><section class="hero"><h2>快速找到你需要的外贸工具</h2><p>整合客户开发、B2B平台、物流查询、社交媒体、收款工具与 AI 助手</p><div class="searchrow"><input id="search" class="search" placeholder="🔎 搜索网站名称、分类或网址…（按 / 快速定位）"><select id="engine" aria-label="搜索引擎"><option value="google">Google 搜索</option><option value="bing">Bing 搜索</option><option value="duck">DuckDuckGo</option></select><button class="btn primary" id="webSearch">搜索全网 ↗</button></div><div class="quick"><a href="https://www.alibaba.com" target="_blank" rel="noopener">Alibaba ↗</a><a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn ↗</a><a href="https://web.whatsapp.com" target="_blank" rel="noopener">WhatsApp ↗</a><a href="https://www.17track.net" target="_blank" rel="noopener">17TRACK ↗</a><a href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT ↗</a></div><div class="statline"><span>网站总数 <strong id="totalStat">19</strong></span><span>已收藏 <strong id="favStat">0</strong></span><span id="clock"></span></div></section><div class="actions"><button class="btn" id="export">↓ 导出数据</button><button class="btn" id="import">↑ 导入数据</button><button class="btn" id="addCat">＋ 新建分类</button><button class="btn" id="sortName">↕ 名称排序</button><input id="file" type="file" accept="application/json" hidden></div><div class="chips" id="chips"></div><div class="heading"><h2 id="section">全部网站</h2><span class="count" id="count"></span></div><div class="grid" id="grid"></div><div class="footer">TradeHub Pro Ultimate V2 · 数据保存在当前浏览器 · 建议定期导出备份</div></main></div><div class="modal" id="modal"><form class="panel" id="form"><h2 id="modalTitle">添加网址</h2><label>网站名称<input id="name" required maxlength="80" placeholder="例如 Alibaba"></label><label>网址（https://）<input id="url" required type="url" placeholder="https://www.example.com"></label><label>分类<select id="category"></select></label><label>简介<input id="description" maxlength="120" placeholder="简短描述"></label><div class="actions" style="justify-content:flex-end;margin-top:20px"><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit">保存</button></div></form></div><script>
const categories=['全部','收藏','B2B平台','客户开发','物流查询','社交媒体','跨境收款','搜索引擎','AI工具','其他'];const defaults=[['Alibaba','https://www.alibaba.com','B2B平台','全球B2B采购平台'],['Made-in-China','https://www.made-in-china.com','B2B平台','中国制造网'],['Global Sources','https://www.globalsources.com','B2B平台','环球资源'],['1688','https://www.1688.com','B2B平台','国内供应链采购'],['Google','https://www.google.com','搜索引擎','全球搜索引擎'],['Bing','https://www.bing.com','搜索引擎','微软搜索引擎'],['LinkedIn','https://www.linkedin.com','客户开发','商业社交与客户开发'],['Google Maps','https://maps.google.com','客户开发','搜索本地企业'],['Facebook','https://www.facebook.com','社交媒体','社交营销平台'],['Instagram','https://www.instagram.com','社交媒体','图片和短视频营销'],['WhatsApp Web','https://web.whatsapp.com','社交媒体','客户沟通'],['TikTok','https://www.tiktok.com','社交媒体','短视频平台'],['DHL','https://www.dhl.com','物流查询','国际快递服务'],['FedEx','https://www.fedex.com','物流查询','国际快递查询'],['17TRACK','https://www.17track.net','物流查询','国际物流追踪'],['PayPal','https://www.paypal.com','跨境收款','跨境支付平台'],['Wise','https://wise.com','跨境收款','国际汇款服务'],['ChatGPT','https://chatgpt.com','AI工具','AI写作与研究'],['DeepL','https://www.deepl.com','AI工具','多语言翻译']].map((a,i)=>({id:i+1,name:a[0],url:a[1],category:a[2],description:a[3],favorite:false}));
let sites;try{const x=JSON.parse(localStorage.getItem('tradehub_sites'));sites=Array.isArray(x)?x:defaults}catch{sites=defaults}let customCategories=[];try{customCategories=JSON.parse(localStorage.getItem('tradehub_categories_v2')||'[]').filter(x=>typeof x==='string'&&x.length<32&&!categories.includes(x))}catch{}categories.splice(categories.length-1,0,...customCategories);let alphabetical=false;let selected='全部',editId=null;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('tradehub_sites',JSON.stringify(sites));const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.trim().toLowerCase();$('nav').innerHTML=categories.map((c,i)=>`<button class="nav ${selected===c?'active':''}" data-cat="${safe(c)}" data-icon="${['⌂','★','▣','◎','▤','◉','＄','⌕','✦','☷'][i]}">${safe(c)}</button>`).join('');$('chips').innerHTML=categories.map(c=>`<button class="chip ${selected===c?'active':''}" data-cat="${safe(c)}">${safe(c)}</button>`).join('');let shown=sites.filter(s=>(selected==='全部'||(selected==='收藏'?s.favorite:s.category===selected))&&[s.name,s.url,s.category,s.description].join(' ').toLowerCase().includes(q));$('section').textContent=selected==='全部'?'全部网站':selected;$('count').textContent=shown.length+' 个网站';if(alphabetical)shown.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));$('totalStat').textContent=sites.length;$('favStat').textContent=sites.filter(x=>x.favorite).length;$('grid').innerHTML=shown.map(s=>`<article class="card"><div class="card-top"><div class="logo"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(s.url).hostname)}&sz=64" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.textContent='🌐'"></div><button class="star ${s.favorite?'on':''}" data-fav="${s.id}" title="收藏">★</button></div><div><a href="${safe(s.url)}" target="_blank" rel="noopener noreferrer">${safe(s.name)} ↗</a><div class="desc">${safe(s.description||s.url)}</div></div><div class="card-foot"><span class="tag">${safe(s.category)}</span><span><button class="mini" data-edit="${s.id}">编辑</button><button class="mini" data-del="${s.id}">删除</button></span></div></article>`).join('')||'<div class="empty">没有匹配的网址。试试其他关键词，或点击右上角添加网址。</div>'}document.addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){selected=c.dataset.cat;render()}const f=e.target.closest('[data-fav]');if(f){let s=sites.find(x=>x.id==f.dataset.fav);s.favorite=!s.favorite;save();render()}const d=e.target.closest('[data-del]');if(d&&confirm('确定删除这个网址吗？')){sites=sites.filter(x=>x.id!=d.dataset.del);save();render()}const ed=e.target.closest('[data-edit]');if(ed){let s=sites.find(x=>x.id==ed.dataset.edit);editId=s.id;for(const k of ['name','url','category','description'])$(k).value=s[k];$('modalTitle').textContent='编辑网址';$('modal').classList.add('show')}});$('category').innerHTML=categories.filter(x=>!['全部','收藏'].includes(x)).map(x=>`<option>${x}</option>`).join('');$('search').addEventListener('input',render);$('add').onclick=()=>{editId=null;$('form').reset();$('modalTitle').textContent='添加网址';$('modal').classList.add('show')};$('cancel').onclick=()=>$('modal').classList.remove('show');$('form').onsubmit=e=>{e.preventDefault();const obj={name:$('name').value.trim(),url:$('url').value.trim(),category:$('category').value,description:$('description').value.trim()};if(!/^https?:\/\//i.test(obj.url)){alert('网址必须以 http:// 或 https:// 开头');return}if(editId){Object.assign(sites.find(x=>x.id===editId),obj)}else sites.push({...obj,id:Date.now(),favorite:false});save();$('modal').classList.remove('show');render()};$('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('tradehub_theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('tradehub_theme')==='light')document.body.classList.add('light');$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sites,null,2)],{type:'application/json'}));a.download='tradehub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(s=>s.name&&/^https?:\/\//.test(s.url)&&s.category))throw Error();if(confirm('导入将覆盖当前网站列表，建议先导出备份。继续吗？')){sites=data.map((s,i)=>({...s,id:i+1,favorite:!!s.favorite}));save();render()}}catch{alert('导入失败：JSON 数据格式不正确')}e.target.value=''};$('addCat').onclick=()=>{const name=prompt('输入新分类名称（最多 30 个字符）');if(!name)return;const n=name.trim().slice(0,30);if(!n||categories.includes(n)){alert('分类名称为空或已存在');return}categories.splice(categories.length-1,0,n);customCategories.push(n);localStorage.setItem('tradehub_categories_v2',JSON.stringify(customCategories));$('category').innerHTML=categories.filter(x=>!['全部','收藏'].includes(x)).map(x=>`<option>${safe(x)}</option>`).join('');selected=n;render()};$('sortName').onclick=()=>{alphabetical=!alphabetical;$('sortName').textContent=alphabetical?'✓ 按名称排序':'↕ 名称排序';render()};$('webSearch').onclick=()=>{const q=$('search').value.trim();if(!q){$('search').focus();return}const bases={google:'https://www.google.com/search?q=',bing:'https://www.bing.com/search?q=',duck:'https://duckduckgo.com/?q='};window.open(bases[$('engine').value]+encodeURIComponent(q),'_blank','noopener,noreferrer')};document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('search').focus()}if(e.key==='Escape')$('modal').classList.remove('show')});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});const updateClock=()=>{$('clock').textContent='本地时间 '+new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})};updateClock();setInterval(updateClock,60000);render();
</script></body></html>
